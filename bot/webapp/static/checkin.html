<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vitalis · чекин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #111111);
  --hint: var(--tg-theme-hint-color, #707579);
  --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
  --btn: var(--tg-theme-button-color, #2a7de1);
  --btn-text: var(--tg-theme-button-text-color, #ffffff);
  --ok: #1f9d55; --warn: #f2b01e; --bad: #d64545;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
       font: 16px/1.35 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
.hidden { display: none !important; }
.muted { color: var(--hint); }
h1 { font-size: 20px; margin: 0 0 2px; }
.counter { margin: 14px 0; padding: 14px 16px; border-radius: 16px; background: var(--card);
           display: flex; align-items: baseline; gap: 8px; }
.counter b { font-size: 34px; font-variant-numeric: tabular-nums; }
.btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 18px 16px; font-size: 19px;
       font-weight: 600; background: var(--btn); color: var(--btn-text); cursor: pointer; }
.btn.secondary { background: var(--card); color: var(--text); font-size: 16px; padding: 14px; font-weight: 500; }
.btn:active { opacity: .8; }
.search { margin-top: 18px; }
input { width: 100%; padding: 14px; font-size: 17px; border-radius: 12px; border: 1px solid transparent;
        background: var(--card); color: var(--text); outline: none; }
input:focus { border-color: var(--btn); }
.list { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--card); }
.row .who { flex: 1; min-width: 0; }
.row .who div:first-child { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.row button { border: 0; border-radius: 10px; padding: 10px 14px; font-size: 15px; font-weight: 600;
              background: var(--btn); color: var(--btn-text); }
.row .done { color: var(--ok); font-weight: 600; white-space: nowrap; }
.note { margin-top: 10px; font-size: 14px; }
#result { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
          padding: 28px 22px; color: #fff; text-align: center; z-index: 10; }
#result.ok { background: var(--ok); }
#result.warn { background: var(--warn); color: #1a1a1a; }
#result.bad { background: var(--bad); }
#result .icon { font-size: 74px; line-height: 1; }
#result .title { font-size: 30px; font-weight: 800; margin: 14px 0 8px; }
#result .name { font-size: 24px; font-weight: 600; }
#result .sub { font-size: 18px; margin-top: 6px; opacity: .9; }
#result .actions { margin-top: 34px; display: grid; gap: 10px; }
#result .btn { background: rgba(255,255,255,.95); color: #111; }
#result .btn.ghost { background: transparent; color: inherit; border: 2px solid currentColor; font-size: 16px; }
.center { text-align: center; padding-top: 30vh; }
</style>
</head>
<body>
<div id="loading" class="center muted">Загрузка…</div>

<div id="denied" class="center hidden">
  <h1>Нет доступа</h1>
  <p class="muted">Попроси организатора прислать ссылку-приглашение для проверяющих.</p>
</div>

<div id="app" class="hidden">
  <h1 id="title"></h1>
  <div id="when" class="muted"></div>
  <div class="counter"><span>Пришло</span> <b id="came">0</b> <span>из <span id="total">0</span></span></div>
  <button id="scanBtn" class="btn">Сканировать билет</button>
  <div id="noScanner" class="note muted hidden">Сканер QR недоступен в этой версии Telegram. Ищи по фамилии ниже.</div>
  <div class="search">
    <input id="q" type="search" placeholder="Фамилия или номер билета" autocomplete="off">
    <div id="list" class="list"></div>
    <div id="empty" class="note muted hidden">Никого не нашли. Проверь написание фамилии.</div>
  </div>
</div>

<div id="result" class="hidden">
  <div class="icon" id="rIcon"></div>
  <div class="title" id="rTitle"></div>
  <div class="name" id="rName"></div>
  <div class="sub" id="rSub"></div>
  <div class="actions">
    <button class="btn" id="rNext">Сканировать следующий</button>
    <button class="btn ghost hidden" id="rUndo">Отменить отметку</button>
    <button class="btn ghost" id="rClose">Закрыть</button>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (id) => document.getElementById(id);
let lastId = null;

if (tg) { tg.ready(); tg.expand(); }

async function api(path, body) {
  const res = await fetch("/api/checkin/" + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "tma " + (tg ? tg.initData : "") },
    body: JSON.stringify(body || {}),
  });
  if (res.status === 401 || res.status === 403) { showDenied(); throw new Error("denied"); }
  if (!res.ok) throw new Error("http " + res.status);
  return res.json();
}

function showDenied() {
  $("loading").classList.add("hidden"); $("app").classList.add("hidden"); $("denied").classList.remove("hidden");
}

function setInfo(d) {
  if (d.event) { $("title").textContent = d.event.title; $("when").textContent = d.event.when; }
  if (typeof d.came === "number") { $("came").textContent = d.came; $("total").textContent = d.total; }
}

function haptic(kind) {
  try { tg && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
}

const VIEW = {
  ok:          ["ok",   "✓", "Можно проходить", "warn"],
  already:     ["warn", "!", "Уже отмечен", "warning"],
  invalid:     ["bad",  "✕", "Билет недействителен", "error"],
  cancelled:   ["bad",  "✕", "Билет недействителен", "error"],
  other_event: ["bad",  "✕", "Билет на другую встречу", "error"],
  unmarked:    ["warn", "↺", "Отметка снята", "warning"],
};

function showResult(r) {
  const [cls, icon, title, hap] = VIEW[r.status] || VIEW.invalid;
  $("result").className = cls;
  $("rIcon").textContent = icon;
  $("rTitle").textContent = title;
  $("rName").textContent = r.name || "";
  let sub = "";
  if (r.ticket_no) sub = "Билет №" + r.ticket_no;
  if (r.status === "already" && r.checked_at) sub += (sub ? " · " : "") + "отмечен в " + r.checked_at;
  if (r.status === "cancelled") sub = "Отменён или не выдавался";
  if (r.status === "invalid") sub = "QR-код не от билета Vitalis";
  $("rSub").textContent = sub;
  lastId = r.status === "ok" ? r.id : null;
  $("rUndo").classList.toggle("hidden", lastId === null);
  $("rNext").classList.toggle("hidden", !canScan());
  haptic(hap);
  setInfo(r);
}

function hideResult() { $("result").className = "hidden"; refreshSearch(); }

function canScan() { return !!(tg && tg.showScanQrPopup && tg.isVersionAtLeast && tg.isVersionAtLeast("6.4")); }

function scan() {
  if (!canScan()) return;
  tg.showScanQrPopup({ text: "Наведи камеру на QR-код билета" }, (text) => {
    api("scan", { payload: text }).then(showResult).catch(netError);
    return true;  // закрываем сканер, показываем результат
  });
}

function netError(e) {
  if (e && e.message === "denied") return;
  if (tg) tg.showAlert("Нет связи с сервером. Попробуй ещё раз."); else alert("Нет связи с сервером");
}

let timer = null;
function refreshSearch() {
  const q = $("q").value.trim();
  if (!q) { $("list").innerHTML = ""; $("empty").classList.add("hidden"); return; }
  api("search", { q }).then((d) => renderList(d.items)).catch(netError);
}

function renderList(items) {
  const list = $("list");
  list.innerHTML = "";
  $("empty").classList.toggle("hidden", items.length > 0);
  for (const it of items) {
    const row = document.createElement("div");
    row.className = "row";
    const who = document.createElement("div");
    who.className = "who";
    const n = document.createElement("div"); n.textContent = it.name;
    const s = document.createElement("div"); s.className = "muted"; s.textContent = "Билет №" + it.ticket_no;
    who.append(n, s);
    row.append(who);
    if (it.checked_at) {
      const d = document.createElement("span"); d.className = "done"; d.textContent = "✓ " + it.checked_at;
      row.append(d);
    } else {
      const b = document.createElement("button"); b.textContent = "Отметить";
      b.onclick = () => { b.disabled = true; api("mark", { id: it.id }).then(showResult).catch(netError); };
      row.append(b);
    }
    list.append(row);
  }
}

$("scanBtn").onclick = scan;
$("rNext").onclick = () => { hideResult(); scan(); };
$("rClose").onclick = hideResult;
$("rUndo").onclick = () => { if (lastId) api("unmark", { id: lastId }).then(showResult).catch(netError); };
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(refreshSearch, 300); });

api("me").then((d) => {
  setInfo(d);
  $("loading").classList.add("hidden");
  $("app").classList.remove("hidden");
  if (!canScan()) { $("scanBtn").classList.add("hidden"); $("noScanner").classList.remove("hidden"); }
  setInterval(() => api("me").then(setInfo).catch(() => {}), 15000);
}).catch((e) => { if (e.message !== "denied") { $("loading").textContent = "Нет связи с сервером. Закрой и открой ещё раз."; } });
</script>
</body>
</html>
